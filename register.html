<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - IponTrack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <button onclick="toggleDarkMode()" id="darkModeToggle" class="theme-toggle">🌙</button>
    
    <h2>Register</h2>
    <p class="subtitle">Create your secure IponTrack account</p>

    <div class="form">
      <input id="regEmail" type="email" placeholder="Enter your email">
      <input id="regPassword" type="password" placeholder="Create a password">

      <button class="btn primary" onclick="register()">Create Account</button>
      <button class="btn outline" onclick="goLogin()">Already have an account?</button>
    </div>
  </div>

  <script>
    (function() {
      const toggle = document.getElementById('darkModeToggle');
      if (localStorage.getItem('ipontrack-theme') === 'dark') {
        document.body.classList.add('dark');
        if (toggle) toggle.textContent = '☀️';
      }
    })();
    
    function toggleDarkMode() {
      const toggle = document.getElementById('darkModeToggle');
      const isDark = document.body.classList.toggle('dark');
      if (toggle) toggle.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('ipontrack-theme', isDark ? 'dark' : 'light');
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
