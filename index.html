<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IponTrack Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Login</h2>
    <p class="subtitle">Log in to track your savings</p>

    <div class="form">
      <input id="email" type="email" placeholder="Email address">
      <input id="password" type="password" placeholder="Password">

      <button class="btn primary" onclick="login()">Login to Dashboard</button>
      <button class="btn outline" onclick="goRegister()">Create New Account</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
