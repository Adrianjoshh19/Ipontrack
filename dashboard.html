<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IponTrack Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <h2 class="logo">IponTrack</h2>

    <button onclick="showPanel('overview')">HOME</button>
    <button onclick="showPanel('goals')">Goals</button>
    <button onclick="showPanel('history')">History</button>
    <button onclick="showPanel('analytics')">Savings Analytics</button>
    <button onclick="showPanel('premium')">Premium</button>

    <button onclick="toggleDarkMode()" id="darkModeToggle">🌙 Dark Mode</button>
    <button class="logout" onclick="logout()">Logout</button>
  </aside>

  <main class="main">

    <!-- OVERVIEW -->
<section id="HOME" class="panel">
  <div class="overview-card">

    <p id="greetingMessage" class="greeting">Hello!</p>

    <p class="label">Total Savings</p>

    <h1 id="totalSavings">₱0</h1>

    <button onclick="openDeposit()" class="primary-btn">
      + Add Savings
    </button>

    <!-- Savings Tip -->
    <div class="savings-tip">
      <span class="tip-icon">💡</span>
      <p id="savingsTip">Loading tip...</p>
    </div>

  </div>
</section>

    <!-- GOALS -->
    <section id="goals" class="panel hidden">
      <h1>Your Goals</h1>

      <div class="form">
        <input id="goalName" placeholder="Goal name">
        <input id="goalAmount" type="number" placeholder="Target amount">
        <button onclick="addGoal()">Add Goal</button>
      </div>

      <!-- goals render here -->
      <div id="goalList"></div>
    </section>

    <!-- HISTORY -->
    <section id="history" class="panel hidden">
      <h1>Transaction History</h1>

      <table class="history-table">
        <thead>
          <tr>
            <th>Amount</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="historyList"></tbody>
      </table>
    </section>

    <!-- ANALYTICS -->
    <section id="analytics" class="panel hidden">

      <h1>Savings Analytics</h1>

      <p id="noAnalytics" style="color:#94a3b8; display:none;">
        No analytics yet
      </p>

      <!-- SAVINGS ACTIVITY -->
      <div id="analyticsList"></div>

      <!-- 🔥 NEW GOAL PROGRESS -->
      <h2 class="progress-title">Goal Progress</h2>

      <div id="goalProgressList"></div>

    </section>

    <!-- PREMIUM -->
    <section id="premium" class="panel hidden">
      <h1>Activate Premium</h1>

      <input id="activation_code" placeholder="Enter activation code">

      <button onclick="activate()">Activate</button>

      <p id="premiumStatus">Free Account</p>
    </section>

  </main>

</div>

<!-- MODAL -->
<div id="depositModal" class="modal hidden">

  <div class="modal-box">

    <h3>Add Savings</h3>

    <input
      id="amount"
      type="number"
      placeholder="Enter amount"
    >

    <div class="modal-actions">

      <button
        class="cancel-btn"
        onclick="closeDeposit()"
      >
        Cancel
      </button>

      <button
        class="save-btn"
        onclick="deposit()"
      >
        Save Savings
      </button>

    </div>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
